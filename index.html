<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B1320" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>PIN CRM — by Triple Shield</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!--
      Cache-buster: if the browser loads a stale cached copy of this file
      that has an old build ID, it forces one silent reload to pull the
      latest assets. After that single reload the IDs match and no more
      reloads happen.
    -->
    <script>
      (function () {
        var BUILD = 'pin-crm-v4';
        try {
          if (localStorage.getItem('_build') !== BUILD) {
            localStorage.setItem('_build', BUILD);
            // Only reload when we know we loaded from cache (not already reloading)
            if (!sessionStorage.getItem('_reloaded_' + BUILD)) {
              sessionStorage.setItem('_reloaded_' + BUILD, '1');
              location.reload(true);
            }
          }
        } catch (e) { /* private/restricted mode — skip */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
