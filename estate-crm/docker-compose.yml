services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: estate_crm
      POSTGRES_USER: estate_crm
      POSTGRES_PASSWORD: estate_crm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: estate_crm_test
      POSTGRES_USER: estate_crm
      POSTGRES_PASSWORD: estate_crm
    ports:
      - "5433:5432"

volumes:
  postgres_data:
