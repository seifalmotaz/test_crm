services:
  # ────────────────────────────────────────────
  # PostgreSQL
  # ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=${POSTGRES_DB:-estate_crm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-estate_crm}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - estate-crm

  # ────────────────────────────────────────────
  # Redis
  # ────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - estate-crm

  # ────────────────────────────────────────────
  # MinIO (S3-compatible object storage)
  # ────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_BROWSER=${MINIO_BROWSER:-on}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - estate-crm

  # ────────────────────────────────────────────
  # Init: create MinIO bucket + policy
  # ────────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        echo 'Waiting for MinIO...';
        sleep 5;
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
        mc mb --ignore-existing local/${S3_BUCKET:-estate-crm};
        mc anonymous set download local/${S3_BUCKET:-estate-crm};
        echo 'MinIO bucket ready';
      "
    networks:
      - estate-crm

  # ────────────────────────────────────────────
  # Estate CRM API
  # ────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # --- App ---
      - NODE_ENV=production
      - PORT=3000
      - CORS_ORIGIN=${CORS_ORIGIN}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN}

      # --- DB ---
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-estate_crm}?sslmode=disable
      - DATABASE_URL_TEST=${DATABASE_URL_TEST}

      # --- Redis ---
      - REDIS_URL=redis://redis:6379

      # --- JWT secret (simple single-line string, used with HS256) ---
      - JWT_SECRET=${JWT_SECRET}

      # --- S3 / MinIO ---
      - S3_BUCKET=${S3_BUCKET:-estate-crm}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - estate-crm
    expose:
      - "3000"

  # ────────────────────────────────────────────
  # Estate CRM Web (Vite + React SPA)
  # ────────────────────────────────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
    restart: unless-stopped
    depends_on:
      - app
    networks:
      - estate-crm
    expose:
      - "80"

volumes:
  postgres_data:
  minio_data:

networks:
  estate-crm:
    driver: bridge
