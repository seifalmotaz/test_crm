server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow uploads up to 25 MB (matches MAX_FILE_SIZE_MB in backend/.env)
    client_max_body_size 25m;

    # Proxy API requests to the backend service
    location /api/ {
        proxy_pass         http://backend:5001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Proxy file uploads served from backend
    # ^~ ensures this prefix match beats the image-caching regex below
    location ^~ /uploads/ {
        proxy_pass         http://backend:5001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # Proxy health check endpoint
    location /health {
        proxy_pass http://backend:5001;
    }

    # index.html — never cache so the browser always gets the latest build
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
        add_header Expires       "0";
    }

    # All other requests → React SPA (HTML5 history routing)
    location / {
        try_files $uri $uri/ /index.html;
        # Prevent HTML files from being cached
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
        add_header Expires       "0";
    }

    # Hashed JS/CSS/fonts/images — safe to cache forever (filename changes on rebuild)
    location ~* \.(js|css|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
